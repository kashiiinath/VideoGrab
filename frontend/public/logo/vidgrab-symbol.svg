<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Cyan to Magenta Gradient -->
    <linearGradient id="vgs-grad" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00D2FF" />
      <stop offset="48%" stopColor="#5B38FF" />
      <stop offset="100%" stopColor="#E024D6" />
    </linearGradient>

    <!-- Play Button Gradient -->
    <linearGradient id="vgs-play-grad" x1="75" y1="65" x2="135" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00F0FF" />
      <stop offset="50%" stopColor="#5336FF" />
      <stop offset="100%" stopColor="#E226D8" />
    </linearGradient>

    <!-- Deep Glow -->
    <filter id="vgs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#563BFF" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Group with Glow -->
  <g filter="url(#vgs-glow)">
    <!-- Outer Track / Video Frame with Downward Arrow -->
    <path
      d="M56 68C56 50.3 70.3 36 88 36H136C147 36 156 45 156 56V126L170 126L146 156L122 126L136 126V56C136 56 136 56 136 56H88C81.4 56 76 61.4 76 68V132C76 138.6 81.4 144 88 144H130V164H88C70.3 164 56 149.7 56 132V68Z"
      fill="url(#vgs-grad)"
    />

    <!-- Center Play Triangle with Smooth Rounded Corners -->
    <path
      d="M84 76C84 69.8 90.8 66 96 69.2L132 93.2C136.8 96.4 136.8 103.6 132 106.8L96 130.8C90.8 134 84 130.2 84 124V76Z"
      fill="url(#vgs-play-grad)"
    />
  </g>
</svg>
